name: colourmaster
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+8

environment:
  sdk: '>=3.5.1 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  package_info_plus: ^9.0.0
  upgrader: ^12.3.0
  cherry_toast: ^1.10.1
  form_field_validator: ^1.1.0
  fluttertoast: ^9.0.0
  loading_overlay: ^0.5.0
  connectivity_plus: ^7.0.0
  provider: ^6.1.1
  http: ^1.2.1
  loading_indicator: ^3.1.1
  material_dialogs: ^1.1.4
  lottie: ^3.3.1
  double_back_to_close_app: ^2.1.0
  flutter_svg: ^2.2.2
  pinput: 5.0.2
  local_auth: ^2.2.0
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  focus_detector: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_screenutil: ^5.9.0
  smooth_page_indicator: ^1.0.0+2
  flutter_exit_app: ^2.0.0
  modal_bottom_sheet: ^3.0.0
  flutter_localization: ^0.3.3
  map_launcher: ^3.3.1
  flutter_email_sender: ^8.0.0
  permission_handler: ^12.0.1
  app_settings: ^6.1.1
  dots_indicator: ^4.0.1
  image_picker: ^1.1.2
  image_cropper: ^11.0.0
  path_provider: ^2.1.4
  mobile_scanner: ^7.1.3
  carousel_slider: ^5.0.0
  share_plus: ^12.0.1
  photo_view: ^0.15.0
  retry: ^3.1.2
  url_launcher: ^6.3.1
  flutter_secure_storage: ^9.2.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  card_swiper: ^3.0.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/ic_launcher.png
    - assets/success_anime.json
    - assets/warning.json
    - assets/svg/
    - assets/images/user_avatar.png
    - assets/images/star_icon.png
    - assets/images/smart_phone.png
    - assets/images/check-mark.png
    - assets/images/error_icon.png
    - assets/images/warning_icon.png
    - assets/images/setting_icon.png
    - assets/images/question_comment_icon.png
    - assets/images/pin.png
    - assets/images/heart.png
    - assets/images/heart_filled.png
    - assets/images/www_icon.png
    - assets/images/credit_card_icon.png
    - assets/images/splash_img.png
    - assets/images/background.png
    - assets/images/home_backgrond_img.png
    - assets/images/home_bottom_background_img.png
    - assets/images/header_bg.png
    - assets/images/user.png
    - assets/images/home_icon.png
    - assets/svg/refer.svg
    - assets/svg/menu_icon.svg
    - assets/svg/bottom_bar_gift_icon.svg
    - assets/svg/bottom_bar_qr_icon.svg
    - assets/svg/bottom_bar_transaction_icon.svg
    - assets/svg/bottom_bar_redeem_icon.svg
    - assets/images/lifetime_balance_icon.png
    - assets/images/available_balance_icon.png
    - assets/images/gift_image.png
    - assets/images/no_image.png
    - assets/images/conversion.png
    - assets/images/transaction.png
    - assets/images/menu.png
    - assets/images/logo.png
    - assets/images/backarrow.png
    - assets/images/home_top_bg.png
    - assets/images/case_redeem.png
    - assets/images/transaction_filled.png
    - assets/images/gift.png
    - assets/images/scan.png
    - assets/images/transaction1.png
    - assets/images/like.png
    - assets/images/process.png
    - assets/images/reject.png
    - assets/images/home.png


  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Light.ttf
          weight: 300
        - asset: assets/fonts/Raleway-Medium.ttf
          weight: 500
        - asset: assets/fonts/Raleway-Regular.ttf
          weight: 400
        - asset: assets/fonts/Raleway-SemiBold.ttf
          weight: 600
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

